name: Deploy static site to AWS
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: aws-site
  cancel-in-progress: false
jobs:
  deploy:
    # Disabled until preview infrastructure and repository variables are configured.
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate using the site-specific OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          allowed-account-ids: '217202382383'
      - name: Publish public assets and wait for cache invalidation
        env:
          AWS_SITE_BUCKET: ${{ vars.AWS_SITE_BUCKET }}
          AWS_DISTRIBUTION_ID: ${{ vars.AWS_DISTRIBUTION_ID }}
        run: bash scripts/deploy-aws.sh
