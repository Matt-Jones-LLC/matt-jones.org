[project]
name = "matt-jones-company"
version = "0.1.0"
description = "Company home and development launchpad for Matt Jones LLC"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.11", "pytest>=8"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
